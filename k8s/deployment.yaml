apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-mcp-deployment
  namespace: apps  
  labels:
    app: sales-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales-mcp
  template:
    metadata:
      labels:
        app: sales-mcp
    spec:
      containers:
      - name: sales-mcp-container
        image: knowbr/sales-mcp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        
        # 👇 CORREÇÃO DE SEGURANÇA ADICIONADA AQUI
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault

        env:
        # 1. Alimenta o GetConnectionString("ReadOnly") do C#
        - name: ConnectionStrings__ReadOnly
          valueFrom:
            secretKeyRef:
              name: mcp-database-secret
              key: connection-string
        
        # 2. Injeta a senha direto na memória (Ativa o Builder do C#)
        - name: Database__ReadOnlyPassword
          valueFrom:
            secretKeyRef:
              name: mcp-database-secret
              key: db-password

        # 3. Injeta o Token Bearer direto na memória (Ativa a nova lógica do FileTokenProvider)
        - name: McpOptions__BearerToken
          valueFrom:
            secretKeyRef:
              name: mcp-database-secret
              key: mcp-token

        # 4. Evita que a validação [Required] do DataAnnotations falhe ao iniciar o Host
        - name: McpOptions__BearerTokenFile
          value: "not-used-in-production"

      imagePullSecrets:
      - name: dockerhub-secret
---
# Service: expõe a porta 8080 do pod dentro do cluster.
apiVersion: v1
kind: Service
metadata:
  name: sales-mcp-service
  namespace: apps       # 👈 AJUSTADO DE 'default' PARA 'apps'
  labels:
    app: sales-mcp
spec:
  type: ClusterIP
  selector:
    app: sales-mcp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# Ingress: roteia a URL HTTP pública até o Service acima.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sales-mcp-ingress
  namespace: apps      # 👈 AJUSTADO DE 'default' PARA 'apps'
  labels:
    app: sales-mcp
spec:
  rules:
    - host: ://iaagentsautonomous.com  # 👈 AJUSTADO PARA O SEU HOST REAL DO POSTMAN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sales-mcp-service
                port:
                  number: 8080
