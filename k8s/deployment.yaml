apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-mcp-deployment
  namespace: default # Ajustado com 2 espaços de recuo (dentro de metadata)
  labels:
    app: sales-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales-mcp
  template:
    metadata:
      labels:
        app: sales-mcp
    spec:
      containers:
      - name: sales-mcp-container
        image: knowbr/sales-mcp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080 # Altere para a porta interna da sua aplicação, se necessário
      
      # Corrigido o alinhamento para o nível da spec do Pod
      imagePullSecrets:
      - name: dockerhub-secret
