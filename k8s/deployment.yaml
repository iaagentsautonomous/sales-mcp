apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-mcp-deployment
  namespace: default
  labels:
    app: sales-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales-mcp
  template:
    metadata:
      labels:
        app: sales-mcp
    spec:
      containers:
      - name: sales-mcp-container
        image: knowbr/sales-mcp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        
        env:
        - name: ConnectionStrings__ReadOnly
          valueFrom:
            secretKeyRef:
              name: mcp-database-secret
              key: connection-string
        
        # Mudamos para /tmp/ que possui permissão irrestrita de leitura/escrita no Linux
        - name: Database__ReadOnlyPasswordFile
          value: "/tmp/readonly-password.txt"

        - name: McpOptions__BearerTokenFile
          value: "/tmp/bearer-token.txt"

        volumeMounts:
        - name: mcp-secrets-volume
          mountPath: /tmp
          readOnly: false # Permite que o container manipule a pasta se necessário

      imagePullSecrets:
      - name: dockerhub-secret

      volumes:
      - name: mcp-secrets-volume
        secret:
          secretName: mcp-database-secret
          items:
          - key: db-password
            path: readonly-password.txt
          - key: mcp-token
            path: bearer-token.txt
