name: Deploy Automático K8s

on:
  push:
    branches:
      - main # Dispara o deploy sempre que houver push na branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir e Enviar Imagem Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile # Dockerfile da raiz (copia todo o codigo-fonte)
        push: true
        no-cache: true          # ← força rebuild sem usar cache antigo
        tags: |
          knowbr/sales-mcp:latest
          knowbr/sales-mcp:${{ github.sha }}

    - name: Configurar Contexto do Kubernetes
      uses: azure/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Executar o Deploy no Cluster
      run: |
        # 1. Aplica as configurações base do manifesto (portas, volumes, etc)
        kubectl apply -f k8s/deployment.yaml
        
        # 2. Força o K8s a atualizar para a tag imutável do commit atual de forma segura
        # NOTA: Ajuste 'sales-mcp-deployment' e 'sales-mcp-container' caso os nomes no seu YAML sejam diferentes
        kubectl set image deployment/sales-mcp-deployment sales-mcp-container=knowbr/sales-mcp:${{ github.sha }}

    - name: Verificar Status do Deploy
      run: |
        # Garante que o pipeline do GitHub só termine com sucesso se o Pod realmente subir na VPS
        kubectl rollout status deployment/sales-mcp-deployment --timeout=90s
