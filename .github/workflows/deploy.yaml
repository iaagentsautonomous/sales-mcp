name: Deploy Automático K8s

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir e Enviar Imagem Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        no-cache: true
        tags: |
          knowbr/sales-mcp:latest
          knowbr/sales-mcp:sha-${{ github.sha }}

    - name: Configurar Contexto do Kubernetes
      uses: azure/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Executar o Deploy no Cluster
      run: |
        # Aplica o manifesto original sem nenhuma alteração por texto/sed
        kubectl apply -f k8s/deployment.yaml
        
        # Atualiza a tag da imagem de forma nativa e segura
        kubectl set image deployment/sales-mcp-deployment sales-mcp-container="knowbr/sales-mcp:sha-${{ github.sha }}" --namespace=apps

    - name: Verificar Status do Deploy
      run: |
        kubectl rollout status deployment/sales-mcp-deployment --namespace=apps --timeout=90s
